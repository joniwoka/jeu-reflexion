<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050a40">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Quête du Savoir Vidéoludique</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#02031a;color:#fff;font-family:system-ui,'Segoe UI',Roboto,Arial,sans-serif;font-size:18px;line-height:1.45}
#app{max-width:560px;margin:0 auto;padding:8px 8px 40px}
canvas#cv{width:100%;image-rendering:pixelated;display:block;border:3px solid #e8e8f4;border-radius:8px;background:#000}
canvas.art{width:100%;image-rendering:pixelated;display:block;margin-top:8px;border:2px solid #e8e8f4;border-radius:6px}
.win{background:linear-gradient(#2a46c8,#0a1658);border:3px solid #e8e8f4;border-radius:10px;box-shadow:inset 0 0 0 2px #0c1a80,0 3px 0 #000;padding:14px 16px;margin-top:10px;text-shadow:1px 1px 0 #000}
#hud{display:flex;justify-content:space-between;gap:8px;font-size:17px;font-weight:700;position:sticky;top:0;z-index:5;margin-top:6px;padding:8px 14px}
button.win{display:block;width:100%;text-align:left;color:#fff;font:inherit;font-size:19px;min-height:58px;cursor:pointer}
button.win.menu::before{content:'▸ ';color:#ffd830}
button.win:active,button.win.sel{background:linear-gradient(#6a84ff,#2a3ec0)}
button.win.ok{background:linear-gradient(#28b050,#0c6a2c)}
button.win.ko{background:linear-gradient(#d83030,#781414)}
button.win:disabled{opacity:1;cursor:default}
button.win.ans:disabled:not(.ok):not(.ko){opacity:.55}
.gold{color:#ffd830}.dim{color:#cdd6ff;font-size:16px;margin:4px 0}
h2{margin:0 0 8px;font-size:22px;color:#ffd830}
hr{border:0;border-top:1px solid #8a9aff;margin:10px 0}
.win .win{margin-top:12px}
</style></head><body>
<div id="app"><canvas id="cv" width="320" height="180"></canvas><div id="hud" class="win"></div><div id="screen"></div></div>
<script src="version.js"></script><script src="questions.js"></script><script src="music.js"></script><script src="gfx.js"></script><script src="sprites.js"></script><script src="game.js"></script>
</body></html>
